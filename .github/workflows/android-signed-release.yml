name: LudoProof Android Signed Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LUDOPROOF_KEYSTORE_BASE64: ${{ secrets.LUDOPROOF_ANDROID_KEYSTORE_BASE64 }}
      LUDOPROOF_RELEASE_STORE_PASSWORD: ${{ secrets.LUDOPROOF_ANDROID_STORE_PASSWORD }}
      LUDOPROOF_RELEASE_KEY_ALIAS: ${{ secrets.LUDOPROOF_ANDROID_KEY_ALIAS }}
      LUDOPROOF_RELEASE_KEY_PASSWORD: ${{ secrets.LUDOPROOF_ANDROID_KEY_PASSWORD }}
      LUDOPROOF_API_BASE_URL: ${{ vars.LUDOPROOF_API_BASE_URL }}
      GOOGLE_SIGN_IN_WEB_CLIENT_ID: ${{ vars.GOOGLE_SIGN_IN_WEB_CLIENT_ID }}
      LUDOPROOF_BILLING_ENABLED: ${{ vars.LUDOPROOF_BILLING_ENABLED }}
      GOOGLE_PLAY_BILLING_ENABLED: ${{ vars.GOOGLE_PLAY_BILLING_ENABLED }}
      LUDOPROOF_ADS_ENABLED: ${{ vars.LUDOPROOF_ADS_ENABLED }}
      LUDOPROOF_ADMOB_SSV_ENABLED: ${{ vars.LUDOPROOF_ADMOB_SSV_ENABLED }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_REWARDED_AD_UNIT_ID: ${{ vars.ADMOB_REWARDED_AD_UNIT_ID }}
      LUDOPROOF_ADMOB_REWARDED_AD_UNIT_ID: ${{ vars.LUDOPROOF_ADMOB_REWARDED_AD_UNIT_ID }}
      PLAY_GAMES_PROJECT_ID: ${{ vars.PLAY_GAMES_PROJECT_ID }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare release signing credential
        shell: bash
        run: |
          set -euo pipefail
          : "${LUDOPROOF_KEYSTORE_BASE64:?Missing LUDOPROOF_ANDROID_KEYSTORE_BASE64 secret}"
          : "${LUDOPROOF_RELEASE_STORE_PASSWORD:?Missing LUDOPROOF_ANDROID_STORE_PASSWORD secret}"
          : "${LUDOPROOF_RELEASE_KEY_ALIAS:?Missing LUDOPROOF_ANDROID_KEY_ALIAS secret}"
          : "${LUDOPROOF_RELEASE_KEY_PASSWORD:?Missing LUDOPROOF_ANDROID_KEY_PASSWORD secret}"

          KEYSTORE="$RUNNER_TEMP/ludoproof-release.jks"
          printf '%s' "$LUDOPROOF_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "LUDOPROOF_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: RC2 release-readiness gate
        run: node scripts/android-release-readiness-check.mjs

      - name: Validate release OAuth, feature flags and production API
        shell: bash
        run: |
          set -euo pipefail
          : "${GOOGLE_SIGN_IN_WEB_CLIENT_ID:?Set the GOOGLE_SIGN_IN_WEB_CLIENT_ID repository variable before creating a signed release.}"
          if ! printf '%s' "$GOOGLE_SIGN_IN_WEB_CLIENT_ID" | grep -Eq '^[0-9]+-[A-Za-z0-9_-]+\\.apps\\.googleusercontent\\.com
        run: gradle -p android :app:testDebugUnitTest --stacktrace

      - name: Release lint
        run: gradle -p android :app:lintRelease --stacktrace

      - name: Build signed release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="${LUDOPROOF_API_BASE_URL:-https://ludoproof-game-api.ai-8f3.workers.dev}"
          gradle -p android :app:assembleRelease :app:bundleRelease --stacktrace \
            -PLUDOPROOF_API_BASE_URL="$API_BASE" \
            -PGOOGLE_SIGN_IN_WEB_CLIENT_ID="$GOOGLE_SIGN_IN_WEB_CLIENT_ID" \
            -PLUDOPROOF_BILLING_ENABLED="${LUDOPROOF_BILLING_ENABLED:-false}" \
            -PLUDOPROOF_ADS_ENABLED="${LUDOPROOF_ADS_ENABLED:-false}" \
            -PLUDOPROOF_ADS_USE_TEST_IDS=false \
            -PADMOB_APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}" \
            -PADMOB_REWARDED_AD_UNIT_ID="${ADMOB_REWARDED_AD_UNIT_ID:-ca-app-pub-3940256099942544/5224354917}" \
            -PPLAY_GAMES_PROJECT_ID="${PLAY_GAMES_PROJECT_ID:-0}"

      - name: Verify APK and AAB signatures
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB"

      - name: Hash Android release evidence
        run: node scripts/hash-android-release.mjs

      - name: Upload signed release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ludoproof-android-1.0.0-rc2-signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            ludoproof-android-release.json
            ludoproof-android-release.sha256
          if-no-files-found: error
          retention-days: 90
; then
            echo "GOOGLE_SIGN_IN_WEB_CLIENT_ID is not a valid Google Web OAuth client ID." >&2
            exit 2
          fi

          API_BASE="${LUDOPROOF_API_BASE_URL:-https://ludoproof-game-api.ai-8f3.workers.dev}"
          case "$API_BASE" in https://*) ;; *) echo "LUDOPROOF_API_BASE_URL must use HTTPS." >&2; exit 2 ;; esac
          APP_BILLING="${LUDOPROOF_BILLING_ENABLED:-false}"
          SERVER_BILLING="${GOOGLE_PLAY_BILLING_ENABLED:-false}"
          APP_ADS="${LUDOPROOF_ADS_ENABLED:-false}"
          SERVER_ADS="${LUDOPROOF_ADMOB_SSV_ENABLED:-false}"
          for flag in "$APP_BILLING" "$SERVER_BILLING" "$APP_ADS" "$SERVER_ADS"; do
            case "$flag" in
              true|false) ;;
              *) echo "Store feature flags must be true or false." >&2; exit 2 ;;
            esac
          done
          if [ "$APP_BILLING" != "$SERVER_BILLING" ]; then
            echo "Android Billing flag must match Worker GOOGLE_PLAY_BILLING_ENABLED." >&2
            exit 2
          fi
          if [ "$APP_ADS" != "$SERVER_ADS" ]; then
            echo "Android Ads flag must match Worker LUDOPROOF_ADMOB_SSV_ENABLED." >&2
            exit 2
          fi
          if [ "$APP_ADS" = "true" ]; then
            : "${ADMOB_APP_ID:?Set real ADMOB_APP_ID before enabling production ads.}"
            : "${ADMOB_REWARDED_AD_UNIT_ID:?Set real ADMOB_REWARDED_AD_UNIT_ID before enabling production ads.}"
            if [ "$ADMOB_REWARDED_AD_UNIT_ID" != "$LUDOPROOF_ADMOB_REWARDED_AD_UNIT_ID" ]; then
              echo "Android and Worker AdMob rewarded-unit IDs must match." >&2
              exit 2
            fi
            if [ "$ADMOB_APP_ID" = "ca-app-pub-3940256099942544~3347511713" ] ||
               [ "$ADMOB_REWARDED_AD_UNIT_ID" = "ca-app-pub-3940256099942544/5224354917" ]; then
              echo "Google sample AdMob IDs are not allowed in a release build." >&2
              exit 2
            fi
          fi

          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$API_BASE/ready" >/dev/null
          status_json="$(curl --fail --silent --show-error "$API_BASE/api/store/status")"
          node -e '
            const status = JSON.parse(process.argv[1]);
            const billing = process.env.LUDOPROOF_BILLING_ENABLED === "true";
            const ads = process.env.LUDOPROOF_ADS_ENABLED === "true";
            if (status.billingAvailable !== billing || status.rewardedAdsAvailable !== ads) {
              console.error("Worker store-status flags do not match the signed Android build configuration.");
              process.exit(2);
            }
            console.log("Production Worker readiness and store feature flags match the requested Android release.");
          ' "$status_json"

      - name: Android unit tests
        run: gradle -p android :app:testDebugUnitTest --stacktrace

      - name: Release lint
        run: gradle -p android :app:lintRelease --stacktrace

      - name: Build signed release APK and AAB
        run: |
          gradle -p android :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK and AAB signatures
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB"

      - name: Hash Android release evidence
        run: node scripts/hash-android-release.mjs

      - name: Upload signed release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ludoproof-android-1.0.0-rc2-signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            ludoproof-android-release.json
            ludoproof-android-release.sha256
          if-no-files-found: error
          retention-days: 90
