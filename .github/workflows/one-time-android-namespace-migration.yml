name: One-time Android namespace migration

on:
  push:
    branches:
      - refactor/rekixo-android-namespace

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/refactor/rekixo-android-namespace'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/rekixo-android-namespace
          fetch-depth: 0

      - name: Rename Android namespace and source packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          old_package = "com.ludoproof.game"
          new_package = "com.rekixo.ludopaws"
          source_root = Path("android/app/src")
          package_dirs = list(source_root.glob("*/java/com/ludoproof/game"))
          if len(package_dirs) != 3:
              raise SystemExit(
                  f"Expected main, test and androidTest source package roots; found {len(package_dirs)}"
              )

          source_file_count = sum(
              1 for package_dir in package_dirs
              for path in package_dir.rglob("*")
              if path.is_file() and path.suffix in {".kt", ".java"}
          )

          for old_dir in package_dirs:
              new_dir = old_dir.parents[1] / "rekixo" / "ludopaws"
              if new_dir.exists():
                  raise SystemExit(f"Refusing to overwrite existing source package directory: {new_dir}")
              new_dir.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(old_dir), str(new_dir))

          text_extensions = {
              ".kt", ".java", ".kts", ".gradle", ".xml", ".md", ".mjs", ".js",
              ".yml", ".yaml", ".properties", ".toml", ".json", ".txt", ".sh",
              ".pro", ".html", ".ps1", ".example", ".gitignore"
          }
          replacements = (
              (old_package, new_package),
              ("com/ludoproof/game", "com/rekixo/ludopaws"),
              ("com\\ludoproof\\game", "com\\rekixo\\ludopaws"),
          )
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in text_extensions and path.name not in {".gitignore", ".editorconfig"}:
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding="utf-8", newline="")

          migration_doc = Path("docs/LUDO_PAWS_MIGRATION.md")
          doc = migration_doc.read_text(encoding="utf-8")
          doc = doc.replace(
              "- Keep the legacy Kotlin namespace/source package declarations, Cloudflare Worker name, Durable Object bindings, storage keys, and proof/ruleset identifiers unchanged in this first identity step.",
              "- The Android application ID, Gradle namespace, and Kotlin/Java source packages now use com.rekixo.ludopaws. The existing Cloudflare Worker name, Durable Object bindings, storage keys, and proof/ruleset identifiers remain unchanged for compatibility."
          )
          doc = doc.replace(
              "retain the legacy Kotlin namespace/source package declarations temporarily.",
              "the Gradle namespace, Kotlin/Java package declarations, and source directory roots now use com.rekixo.ludopaws."
          )
          doc = doc.replace("com.rekixo.ludopaws package/application identity.\n", "")
          if "retain the legacy Kotlin namespace/source package declarations temporarily" in doc:
              raise SystemExit("Migration document still says the old source namespace is retained.")
          record = (
              "\n### Android package migration record (13 October 2026)\n\n"
              "The Android application ID, Gradle namespace, Kotlin/Java source package declarations, "
              "and source directory roots use com.rekixo.ludopaws. Internal class names such as "
              "LudoProofApplication and LudoProofTheme remain unchanged; backend Worker names, "
              "storage keys, and fairness/proof protocol identifiers are not part of this package rename.\n"
          )
          anchor = "## Phase 0 baseline"
          if record.strip() not in doc:
              if anchor not in doc:
                  raise SystemExit("Could not find migration document insertion point.")
              doc = doc.replace(anchor, record + "\n" + anchor, 1)
          migration_doc.write_text(doc, encoding="utf-8", newline="")

          temporary_workflow = Path(".github/workflows/one-time-android-namespace-migration.yml")
          temporary_workflow.unlink(missing_ok=True)

          new_package_dirs = list(source_root.glob("*/java/com/rekixo/ludopaws"))
          new_source_file_count = sum(
              1 for package_dir in new_package_dirs
              for path in package_dir.rglob("*")
              if path.is_file() and path.suffix in {".kt", ".java"}
          )
          if len(new_package_dirs) != 3 or new_source_file_count != source_file_count:
              raise SystemExit(
                  f"Source tree migration count mismatch: roots={len(new_package_dirs)}, "
                  f"before={source_file_count}, after={new_source_file_count}"
              )

          gradle = Path("android/app/build.gradle.kts").read_text(encoding="utf-8")
          if 'namespace = "com.rekixo.ludopaws"' not in gradle:
              raise SystemExit("Gradle namespace did not migrate.")
          if 'applicationId = "com.rekixo.ludopaws"' not in gradle:
              raise SystemExit("Android applicationId unexpectedly changed.")

          old_ref = re.compile(r"com\.ludoproof\.game|com/ludoproof/game|com\\ludoproof\\game")
          remaining = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if old_ref.search(text):
                  remaining.append(str(path))
          if remaining:
              raise SystemExit("Legacy package references remain in: " + ", ".join(remaining[:25]))

          package_decl_count = 0
          for package_dir in new_package_dirs:
              for path in package_dir.rglob("*"):
                  if not path.is_file() or path.suffix not in {".kt", ".java"}:
                      continue
                  text = path.read_text(encoding="utf-8")
                  if re.search(r"^package com\.rekixo\.ludopaws(?:\.|$)", text, re.MULTILINE):
                      package_decl_count += 1
          if package_decl_count != source_file_count:
              raise SystemExit(
                  f"Only {package_decl_count} migrated Kotlin/Java package declarations for {source_file_count} source files."
              )

          print(
              f"Android namespace migration verified: {source_file_count} Kotlin/Java files moved; "
              f"{package_decl_count} package declarations use {new_package}; no legacy package references remain."
          )
          PY

          node scripts/android-release-readiness-check.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes were staged." >&2
            exit 1
          fi
          git commit -m "Refactor Android namespace to Rekixo package"
          git push origin HEAD:refactor/rekixo-android-namespace
