name: LudoProof Cloudflare Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'scripts/cloudflare-deploy-preflight.mjs'
      - 'scripts/production-game-smoke.mjs'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: ludoproof-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' || contains(github.event.head_commit.message, '[deploy-production]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8f31060fbcfee2b3e9309138cad7f12f
      ENTRONEX_API_TOKEN: ${{ secrets.ENTRONEX_API_TOKEN }}
      LUDOPROOF_SESSION_HMAC_KEY: ${{ secrets.LUDOPROOF_SESSION_HMAC_KEY }}
      GOOGLE_SIGN_IN_WEB_CLIENT_ID: ${{ vars.GOOGLE_SIGN_IN_WEB_CLIENT_ID }}
      LUDOPROOF_ACCOUNT_WEB_ORIGIN: ${{ vars.LUDOPROOF_ACCOUNT_WEB_ORIGIN }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PLAY_BILLING_ENABLED: ${{ vars.GOOGLE_PLAY_BILLING_ENABLED }}
      LUDOPROOF_ADMOB_SSV_ENABLED: ${{ vars.LUDOPROOF_ADMOB_SSV_ENABLED }}
      LUDOPROOF_ADMOB_REWARDED_AD_UNIT_ID: ${{ vars.LUDOPROOF_ADMOB_REWARDED_AD_UNIT_ID }}
      LUDOPROOF_ADMOB_REWARD_ITEM: ${{ vars.LUDOPROOF_ADMOB_REWARD_ITEM }}
      LUDOPROOF_WORKER_URL: https://ludoproof-game-api.ai-8f3.workers.dev

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Prepare explicit Cloudflare runtime variables
        run: node scripts/prepare-cloudflare-runtime-config.mjs

      - name: Test Cloudflare runtime configuration
        run: node --test scripts/cloudflare-runtime-config.test.mjs

      - name: Prepare EntroNex customer credential
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${ENTRONEX_API_TOKEN:-}" ]; then
            echo "::add-mask::$ENTRONEX_API_TOKEN"
            echo "ENTRONEX_TOKEN_MODE=operator" >> "$GITHUB_ENV"
            echo "Using operator-supplied EntroNex customer credential."
            exit 0
          fi

          upstream_file="$(mktemp)"
          game_file="$(mktemp)"
          trap 'rm -f "$upstream_file" "$game_file"' EXIT

          npx --yes wrangler@4.135.0 secret list --name entronex-v4-eval --format json > "$upstream_file"

          upstream_has="$(
            node -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const list = Array.isArray(value) ? value : (value.secrets ?? []);
              process.stdout.write(
                list.some((entry) => entry?.name === "ENTRONEX_EVAL_CUSTOMER_TOKEN")
                  ? "yes"
                  : "no"
              );
            ' "$upstream_file"
          )"

          game_has="no"
          if npx --yes wrangler@4.135.0 secret list --name ludoproof-game-api --format json > "$game_file" 2>/dev/null; then
            game_has="$(
              node -e '
                const fs = require("node:fs");
                const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const list = Array.isArray(value) ? value : (value.secrets ?? []);
                process.stdout.write(
                  list.some((entry) => entry?.name === "ENTRONEX_API_TOKEN")
                    ? "yes"
                    : "no"
                );
              ' "$game_file"
            )"
          fi

          if [ "$upstream_has" = "yes" ] && [ "$game_has" = "yes" ]; then
            echo "ENTRONEX_TOKEN_MODE=preserve" >> "$GITHUB_ENV"
            echo "Preserving the existing synchronized EntroNex customer credential."
            exit 0
          fi

          if [ "$upstream_has" = "no" ] && [ "$game_has" = "no" ]; then
            generated_token="$(
              node -e '
                const { randomBytes } = require("node:crypto");
                process.stdout.write(
                  "ent_cf_eval_" +
                    randomBytes(4).toString("hex") +
                    "." +
                    randomBytes(32).toString("base64url")
                );
              '
            )"
            echo "::add-mask::$generated_token"
            {
              echo "ENTRONEX_API_TOKEN=$generated_token"
              echo "ENTRONEX_TOKEN_MODE=bootstrap"
            } >> "$GITHUB_ENV"
            unset generated_token
            echo "Prepared a new EntroNex customer credential for post-test bootstrap."
            exit 0
          fi

          echo "EntroNex customer credential is present on only one Worker." >&2
          echo "Set the production ENTRONEX_API_TOKEN secret once to perform an explicit synchronized rotation." >&2
          exit 2

      - name: Validate production configuration
        run: node scripts/cloudflare-deploy-preflight.mjs

      - name: Verify Google Play service-account secret when Billing is enabled
        if: ${{ vars.GOOGLE_PLAY_BILLING_ENABLED == 'true' }}
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          npx --yes wrangler@4.135.0 secret list --format json > "$secret_file"
          node -e '
            const fs = require("node:fs");
            const parsed = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const list = Array.isArray(parsed) ? parsed : (parsed.secrets ?? []);
            if (!list.some((item) => item?.name === "GOOGLE_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY")) {
              console.error("Billing is enabled but GOOGLE_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY is missing in Cloudflare.");
              process.exit(2);
            }
          ' "$secret_file"

      - name: Repository security gate
        run: node scripts/security-check.mjs

      - name: Server tests
        working-directory: server
        run: npm test

      - name: Wrangler production dry run
        working-directory: server
        run: npx --yes wrangler@4.135.0 deploy --dry-run --outdir .wrangler-production-dry-run

      - name: Deploy Worker
        working-directory: server
        run: npx --yes wrangler@4.135.0 deploy

      - name: Sync server-only runtime secrets
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail

          if [ "${ENTRONEX_TOKEN_MODE:-}" = "preserve" ]; then
            secret_file="$(mktemp)"
            trap 'rm -f "$secret_file"' EXIT
            npx --yes wrangler@4.135.0 secret list --format json > "$secret_file"
            node -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const list = Array.isArray(value) ? value : (value.secrets ?? []);
              if (!list.some((entry) => entry?.name === "ENTRONEX_API_TOKEN")) {
                console.error("Preserved EntroNex token is missing from the deployed LudoProof Worker.");
                process.exit(2);
              }
            ' "$secret_file"
            echo "Preserved existing synchronized EntroNex customer credential."
          elif [ -n "${ENTRONEX_API_TOKEN:-}" ]; then
            printf '%s' "$ENTRONEX_API_TOKEN" | npx --yes wrangler@4.135.0 secret put ENTRONEX_EVAL_CUSTOMER_TOKEN --name entronex-v4-eval

            if ! printf '%s' "$ENTRONEX_API_TOKEN" | npx --yes wrangler@4.135.0 secret put ENTRONEX_API_TOKEN; then
              if [ "${ENTRONEX_TOKEN_MODE:-}" = "bootstrap" ]; then
                curl --fail --silent --show-error                   -X DELETE                   -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"                   "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/entronex-v4-eval/secrets/ENTRONEX_EVAL_CUSTOMER_TOKEN"                   >/dev/null || true
              fi
              echo "Failed to synchronize the EntroNex customer credential into LudoProof." >&2
              exit 2
            fi

            echo "Synchronized EntroNex customer credential across both Workers."
          else
            echo "EntroNex deployment mode requires a customer credential but none is available." >&2
            exit 2
          fi

          if [ -n "${LUDOPROOF_SESSION_HMAC_KEY:-}" ]; then
            printf '%s' "$LUDOPROOF_SESSION_HMAC_KEY" | npx --yes wrangler@4.135.0 secret put LUDOPROOF_SESSION_HMAC_KEY
            echo "Synced operator-managed LUDOPROOF_SESSION_HMAC_KEY."
          else
            npx --yes wrangler@4.135.0 secret list --format json > /tmp/ludoproof-secrets.json
            if node -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync("/tmp/ludoproof-secrets.json", "utf8"));
              const list = Array.isArray(value) ? value : (value.secrets ?? []);
              process.exit(list.some((entry) => entry?.name === "LUDOPROOF_SESSION_HMAC_KEY") ? 0 : 1);
            '; then
              echo "Preserving existing Cloudflare-managed LUDOPROOF_SESSION_HMAC_KEY."
            else
              generated_hmac="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(48).toString("base64url"))')"
              printf '%s' "$generated_hmac" | npx --yes wrangler@4.135.0 secret put LUDOPROOF_SESSION_HMAC_KEY
              unset generated_hmac
              echo "Generated LUDOPROOF_SESSION_HMAC_KEY directly inside the deployment channel."
            fi
            rm -f /tmp/ludoproof-secrets.json
          fi

      - name: Verify public health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$LUDOPROOF_WORKER_URL/health"

      - name: Verify production readiness
        shell: bash
        run: |
          set -euo pipefail
          ready_file="$(mktemp)"
          trap 'rm -f "$ready_file"' EXIT

          status=""
          for attempt in $(seq 1 12); do
            status="$(
              curl --silent --show-error                 --output "$ready_file"                 --write-out '%{http_code}'                 "$LUDOPROOF_WORKER_URL/ready"                 || true
            )"
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 5
          done

          body="$(cat "$ready_file")"
          echo "Readiness HTTP status: $status"
          echo "Readiness response: $body"

          if [ "$status" != "200" ]; then
            echo "Worker readiness endpoint did not reach HTTP 200." >&2
            exit 22
          fi

          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.ready !== true || body.ok !== true) {
              console.error("Worker readiness response is not ready.");
              process.exit(2);
            }
            console.log("LudoProof production Worker is ready.");
          ' "$body"

      - name: Verify live production game flow
        run: node scripts/production-game-smoke.mjs
