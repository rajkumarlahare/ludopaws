name: LudoProof Android Release Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, feat/ludopaws-production-readiness, feat/paws-plus-subscription-lifecycle]

permissions:
  contents: read

concurrency:
  group: ludoproof-android-release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rc2-readiness:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Android RC2 release-readiness gate
        run: node scripts/android-release-readiness-check.mjs
