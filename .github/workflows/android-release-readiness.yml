name: LudoProof Android Release Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - feat/ludopaws-production-readiness

permissions:
  contents: read

concurrency:
  group: ludoproof-android-release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rc3-readiness:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Android RC3 release-readiness gate
        run: node scripts/android-release-readiness-check.mjs

  android-debug-verification:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: rc3-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Android unit tests, lint and debug APK
        run: gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload family-safety debug APK for device testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ludopaws-rc3-family-safety-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
